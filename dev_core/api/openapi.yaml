      summary: 从场景编辑器归档资源
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
        - {$ref: '#/components/parameters/AssetId'}
      responses:
        '200': {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/ApiResponse'}}}}
  /scene-editor-sessions/{sessionId}/assets/{assetId}/editor-session:
    post:
      operationId: createSceneEditorAssetEditorSession
      tags: [scene]
      x-client: ht-editor
      summary: 从场景编辑器打开 Symbol 或 Component 工作副本
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
        - {$ref: '#/components/parameters/AssetId'}
      responses:
        '200': {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/ApiResponse'}}}}
  /scene-editor-sessions/{sessionId}/dependencies:
    get:
      operationId: listSceneEditorDependencies
      tags: [scene]
      x-client: ht-editor
      summary: 分页读取当前场景依赖诊断
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
        - {name: directory, in: query, schema: {type: string}}
        - {name: keyword, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/ApiResponse'}}}}
  /scene-asset-editor-sessions/{sessionId}/files:
    get:
      operationId: listSceneAssetEditorFiles
      tags: [scene]
      x-client: ht-editor
      summary: 分页读取资源编辑工作副本
