  /tenants/{tenantId}/upload:
    post:
      operationId: uploadTenantAsset
      tags: [tenant]
      summary: 上传组织品牌图片
      description: type 支持 logo、background、captcha。返回 fileUrl 和 objectKey；通过组织更新接口保存 logoObjectKey、loginBackgroundObjectKey 或 settings.captchaBackgrounds 后生效。验证码背景最多 10 张，单张不超过 5MB，至少 300×180，最多 1600 万像素。
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
