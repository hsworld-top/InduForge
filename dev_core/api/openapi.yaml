      description: 统一只读运维记录；data.list 与 data.pagination{page,limit,total}。字段及状态语义见统一运维记录查询契约。部署 run 每任务一行；环境/基础服务/节点为事件，requested success 仅 accepted，不代表执行成功。逻辑删除对象保留摘要，taskRef 为空时不可展开。租户由会话决定；任务源需 node:read，事件源需 node:read 与 environment:read。节点三类镜像以 cluster 源为准，cluster 事件无历史环境归属，环境过滤不匹配。时间和 ID 稳定排序，搜索为字面包含匹配。
