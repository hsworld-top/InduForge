openapi: 3.0.3
info:
  title: InduFrame Control Plane API
  version: 0.1.0
  description: dev_core 面向 dev_ide 的控制面契约。
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: tenant
  - name: user
  - name: project
  - name: runtimeAccess
  - name: node
  - name: deployment
  - name: auditLog
  - name: scene
paths:
  /tenants/{tenantId}/reset-admin-password:
    post:
      x-client: studio
      operationId: resetTenantAdminPassword
      tags: [tenant]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminPassword]
              properties:
                adminUsername: { type: string, minLength: 1, maxLength: 50 }
                adminPassword: { type: string, minLength: 8 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /tenants/{tenantId}/initialize:
    post:
      x-client: studio
      operationId: initializeTenant
      tags: [tenant]
      parameters:
        - in: path
          name: tenantId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminUsername, adminPassword]
              properties:
                adminUsername: { type: string, minLength: 1, maxLength: 50 }
                adminPassword: { type: string, minLength: 8 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /auth/tenants:
    get:
      x-client: studio
      operationId: listAuthTenants
      tags: [auth]
      parameters:
        - in: query
          name: code
          description: 精确租户编码，仅返回可登录租户，至多一项；独立于keyword模糊搜索。
          schema: { type: string }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /auth/captcha:
    get:
      operationId: getAuthCaptcha
      tags: [auth]
      summary: 获取一次性拼图挑战（目标X仅存服务端）
      parameters:
        - in: query
          name: username
          required: true
          schema: { type: string }
        - in: query
          name: tenantCode
          required: false
          schema: { type: string }
        - in: query
          name: platform
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaResponse'
        default:
          description: 失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: 获取登录配置或组织品牌图片
      description: 指定 asset 时返回当前组织上传的品牌图片二进制；省略时返回登录配置。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        default:
          description: 失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
