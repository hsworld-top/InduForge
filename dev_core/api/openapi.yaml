components:
  parameters:
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    SceneId: { name: sceneId, in: path, required: true, schema: { type: string } }
    SceneKind:
      { name: kind, in: query, required: true, schema: { type: string, enum: ['2d', '3d'] } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    AssetId: { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    AssetType:
      {
        name: type,
        in: query,
        schema: { type: string, enum: [image, font, model, material, symbol, component] },
      }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit:
      { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
    OpsPage: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    OpsPageSize:
      {
        name: pageSize,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 200, default: 20 },
      }
    OpsSearch: { name: search, in: query, schema: { type: string, maxLength: 200 } }
    OpsKeyword:
      {
        name: keyword,
        in: query,
        schema: { type: string, maxLength: 200 },
        description: search 的兼容别名；search 优先,
      }
    OpsProjectId:
      {
        name: projectId,
        in: query,
        schema: { type: string, format: uuid },
        description: 精确筛选工程部署,
      }
    OpsEnvironmentId:
      {
        name: environmentId,
        in: query,
        schema: { type: string, format: uuid },
        description: 在当前租户内精确筛选运行环境；items 与 total 使用相同条件,
      }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    agentTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: NodeAgentToken
  schemas:
    CaptchaResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              required: [challengeId, image, thumb, width, height, thumbWidth, thumbHeight, thumbX, thumbY, expireSeconds]
              properties:
                challengeId: { type: string }
                image: { type: string, description: '完整背景图片 data URI，不包含目标坐标字段' }
                thumb: { type: string, description: '滑块图片 data URI' }
                width: { type: integer }
                height: { type: integer }
                thumbWidth: { type: integer }
                thumbHeight: { type: integer }
                thumbX: { type: integer, description: '初始横坐标，不是答案' }
                thumbY: { type: integer, description: '固定纵坐标' }
                expireSeconds: { type: integer }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        tenantCode: { type: string }
        sliderChallengeId: { type: string }
        sliderOffset: { type: integer, minimum: 0 }
        platform: { type: boolean, default: false }
        rememberMe: { type: boolean, default: false }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    ChangePasswordRequest:
      type: object
      properties:
        oldPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8 }
    TenantCreateRequest:
      type: object
      required: [name, code, adminUsername, adminPassword]
      properties:
        adminUsername: { type: string, minLength: 1, maxLength: 50 }
        adminPassword: { type: string, format: password, minLength: 8 }
        name: { type: string }
        code: { type: string }
        description: { type: string }
        status: { type: string }
    TenantUpdateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        status: { type: string }
    NoteRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, maxLength: 2000 }
    UserCreateRequest:
      type: object
      additionalProperties: false
      description: 仅组织管理员可创建用户。仅用户名、密码、角色必填，其余为选填高级资料。
      required: [username, password, role]
      properties:
        username: { type: string, minLength: 3, maxLength: 50 }
        password: { type: string, format: password, minLength: 1, description: 非空临时密码；首次登录必须改密，新密码至少8个字符且不同于旧密码，不要求字符组合 }
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 40 }
        fullName: { type: string, maxLength: 100 }
        gender: { type: string, enum: ['', male, female, other, undisclosed] }
        attributes:
          type: object
          description: 自定义文本资料，最多20项；名称不重复且不使用账号或权限字段名，不参与鉴权。
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 500 }
        role: { type: string, enum: [SYSTEM_ADMIN, PROJECT_ADMIN, OPS_ADMIN] }
        status: { type: string, enum: [active, inactive, suspended] }
    UserUpdateRequest:
      type: object
      additionalProperties: false
      description: 用户名不可修改；不传字段保留，空字符串或空属性对象清空。不能修改自己的角色或状态。
      properties:
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 40 }
        fullName: { type: string, maxLength: 100 }
        gender: { type: string, enum: ['', male, female, other, undisclosed] }
        attributes:
          type: object
          description: 自定义文本资料，最多20项；名称不重复且不使用账号或权限字段名，不参与鉴权。
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 500 }
        role: { type: string, enum: [SYSTEM_ADMIN, PROJECT_ADMIN, OPS_ADMIN] }
        status: { type: string, enum: [active, inactive, suspended] }
    ProjectCreateRequest:
      type: object
      required: [name]
      properties:
        template: { type: string, enum: [demo-shell], description: 创建组织内独立的工程模板外壳，不初始化内部示例；每组织最多一份 }
        name: { type: string }
        description: { type: string }
    ProjectUpdateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
    ProjectDeleteRequest:
      type: object
      properties:
        confirmation: { type: string }
    ProjectOperationRequest:
      type: object
      properties:
        operation: { type: string }
    SceneProviderRequest:
      type: object
      required: [provider]
      properties: { provider: { type: string, enum: [induforge] } }
    SceneCreateRequest:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, enum: ['2d', '3d'] }
        name: { type: string, minLength: 1, maxLength: 200 }
        publicContract: { $ref: '#/components/schemas/ScenePublicContract' }
    SceneUpdateRequest:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        publicContract: { $ref: '#/components/schemas/ScenePublicContract' }
        baseDraftVersion: { type: integer, format: int64, minimum: 0 }
    ScenePublicContract:
      type: object
      additionalProperties: false
      required: [description, parameters, events, commands]
      properties:
        description: { type: string, maxLength: 2000 }
        parameters:
          { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SceneParameter' } }
        events:
          {
            type: array,
            maxItems: 100,
            items: { $ref: '#/components/schemas/SceneContractMember' },
          }
        commands:
          { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SceneCommand' } }
    SceneContractMember:
      type: object
      additionalProperties: false
      required: [name, schema]
      properties:
        name: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_.:-]{0,63}$' }
        description: { type: string }
        schema: { type: object, additionalProperties: true }
    SceneParameter:
      type: object
      additionalProperties: false
      required: [name, required, schema]
      properties:
        name: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_.:-]{0,63}$' }
        description: { type: string }
        required: { type: boolean }
        schema: { type: object, additionalProperties: true }
    SceneCommand:
      type: object
      additionalProperties: false
      required: [name, inputSchema, outputSchema]
      properties:
        name: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_.:-]{0,63}$' }
        description: { type: string }
        inputSchema: { type: object, additionalProperties: true }
        outputSchema: { type: object, additionalProperties: true }
    SceneCommitRequest:
      type: object
      required: [baseDraftVersion]
      properties: { baseDraftVersion: { type: integer, format: int64, minimum: 0 } }
    SceneAssetUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    SceneAssetActionRequest:
      type: object
      required: [action, assetId, baseDraftVersion]
      properties:
        action: { type: string, enum: [attach, update, detach] }
        assetId: { type: string, format: uuid }
        baseDraftVersion: { type: integer, format: int64, minimum: 0 }

    SceneAssetFromSelectionRequest:
      type: object
      additionalProperties: false
      required: [name, type, selection]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [symbol, component] }
        selection: { type: object, additionalProperties: true }
    ProjectImportRequest:
      type: object
      properties:
        files: { type: object, additionalProperties: { type: string } }
    NamedResourceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
    ReplaceIDsRequest:
      type: object
      properties:
        ids: { type: array, items: { type: string, format: uuid } }
        roleIds: { type: array, items: { type: string, format: uuid } }
        tagIds: { type: array, items: { type: string, format: uuid } }
    SetProjectGroupRequest:
      type: object
      properties:
        groupId: { type: string, format: uuid, nullable: true }
    RuntimeUserCreateRequest:
      type: object
      required: [username, initialPassword]
      properties:
        username: { type: string }
        initialPassword: { type: string, format: password, minLength: 8 }
        roleIds: { type: array, items: { type: string, format: uuid } }
    RuntimeUserStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, disabled] }
    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string, format: password, minLength: 8 }
    RuntimeRoleCreateRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        capabilities: { type: array, items: { type: string } }
    RuntimeRoleUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/RuntimeRoleCreateRequest'
    NodeApprovalRequest:
      type: object
      properties:
        reason: { type: string }
    PublishVersionRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
    RestoreDevelopmentRequest:
      type: object
      required: [confirmation]
      additionalProperties: false
      properties:
        confirmation: { type: string, enum: [RESTORE] }
    DeployRequest:
      type: object
      required: [nodeIds]
      properties:
        nodeIds: { type: array, items: { type: string, format: uuid } }
        runtimeConfig: { type: object, additionalProperties: true }
    RollbackRequest:
      type: object
      required: [nodeId]
      properties:
        nodeId: { type: string, format: uuid }
    NodeEnrollmentCreateRequest:
      type: object
      required: [platform, capabilities]
      properties:
        platform: { type: string, enum: [linux, windows] }
        capabilities:
          {
            type: array,
            minItems: 1,
            uniqueItems: true,
            items: { type: string, enum: [project_entry, data_runtime, collector] },
          }
        displayName: { type: string, maxLength: 120 }
        ttlMinutes: { type: integer, minimum: 1, maximum: 1440 }
    ProjectDeploymentCreateRequest:
      type: object
      required: [projectId, environmentId, mode, accessPort, placements]
      properties:
        projectId: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        mode: { type: string, enum: [development, production] }
        applicationVersionId:
          { type: string, format: uuid, description: 仅生产模式需要；开发模式由服务端更新内部 __DEV__ 制品槽位。 }
        placements:
          type: object
          additionalProperties: { type: string, format: uuid }
          description: 基础与工程实际使用的可选引擎放置节点。基础引擎固定包含 Gateway 和 Runtime API；计算、报警、采集由服务端从工程制品推导。
        accessPort:
          type: integer
          minimum: 1024
          maximum: 65532
          description: 基础引擎的 hostPort。服务端仅在该基础引擎节点检查端口冲突。
    AgentEnrollmentClaimRequest:
      type: object
      required: [code, hostname, platform, architecture, capabilities]
      properties:
        code: { type: string, minLength: 1 }
        displayName: { type: string }
        hostname: { type: string }
        platform: { type: string, enum: [linux, windows] }
        architecture: { type: string }
        agentVersion: { type: string }
        machineFingerprint: { type: string }
        ipAddress: { type: string }
        capabilities:
          {
            type: array,
            minItems: 1,
            uniqueItems: true,
            items: { type: string, enum: [project_entry, data_runtime, collector] },
          }
    AgentHeartbeatRequest:
      type: object
      required: [resourceSummary]
      properties:
        resourceSummary: { type: object, additionalProperties: true }
        agentVersion: { type: string }
        services:
          type: array
          items:
            type: object
            required: [serviceId, observedStatus, observedGeneration]
            properties:
              serviceId: { type: string, format: uuid }
              observedStatus: { type: string, enum: [running, stopped, failed] }
              observedGeneration: { type: integer, format: int64, minimum: 1 }
              replicasObserved: { type: integer, minimum: 0 }
              message: { type: string }
              endpoint:
                {
                  type: string,
                  format: uri,
                  description: 仅 project_entry 可上报的本机配置 publicUrl；其他服务必须为空,
                }
    ApiResponse:
      type: object
      required: [code, msg, data, reqId]
      properties:
        code:
          type: integer
        msg:
          type: string
        data:
          nullable: true
        reqId:
          type: string
security:
  - bearerAuth: []
