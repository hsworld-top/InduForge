      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        default:
          description: 失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
components:
  parameters:
    ProjectId: {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
    SceneId: {name: sceneId, in: path, required: true, schema: {type: string}}
    SceneKind: {name: kind, in: query, required: true, schema: {type: string, enum: ['2d', '3d']}}
    SessionId: {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
    AssetId: {name: assetId, in: path, required: true, schema: {type: string, format: uuid}}
    AssetType: {name: type, in: query, schema: {type: string, enum: [image, font, model, material, symbol, component]}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string, format: password}
        tenantCode: {type: string}
        sliderChallengeId: {type: string}
        sliderOffset: {type: integer, minimum: 0}
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: {type: string}
    ChangePasswordRequest:
      type: object
      properties:
        oldPassword: {type: string, format: password}
        newPassword: {type: string, format: password, minLength: 8}
    TenantCreateRequest:
      type: object
      required: [name, code]
      properties:
        name: {type: string}
        code: {type: string}
        description: {type: string}
        status: {type: string}
    TenantUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/TenantCreateRequest'
    NoteRequest:
      type: object
      required: [content]
      properties:
        content: {type: string, maxLength: 2000}
    UserCreateRequest:
      type: object
      required: [username, password, role]
      properties:
        username: {type: string}
        password: {type: string, format: password, minLength: 8}
        role: {type: string}
        status: {type: string}
    UserUpdateRequest:
      type: object
      properties:
        email: {type: string}
        phone: {type: string}
        fullName: {type: string}
        role: {type: string}
        status: {type: string}
    ProjectCreateRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        description: {type: string}
    ProjectUpdateRequest:
      type: object
      properties:
        name: {type: string}
        description: {type: string}
    ProjectDeleteRequest:
      type: object
      properties:
        confirmation: {type: string}
    ProjectOperationRequest:
      type: object
      properties:
        operation: {type: string}
    SceneProviderRequest:
      type: object
      required: [provider]
      properties: {provider: {type: string, enum: [induforge]}}
    SceneCreateRequest:
      type: object
      required: [sceneId, kind, name]
      properties:
        sceneId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$'}
        kind: {type: string, enum: ['2d', '3d']}
        name: {type: string, maxLength: 200}
        publicContract: {type: object, additionalProperties: true}
    SceneUpdateRequest:
      type: object
      properties:
        name: {type: string, maxLength: 200}
        publicContract: {type: object, additionalProperties: true}
    SceneCommitRequest:
      type: object
      required: [baseDraftVersion]
      properties: {baseDraftVersion: {type: integer, format: int64, minimum: 0}}
    SceneAssetUpdateRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
    SceneAssetActionRequest:
      type: object
      required: [action, assetId, baseDraftVersion]
      properties:
        action: {type: string, enum: [attach, update, detach]}
        assetId: {type: string, format: uuid}
        baseDraftVersion: {type: integer, format: int64, minimum: 0}
    ProjectImportRequest:
      type: object
      properties:
        files: {type: object, additionalProperties: {type: string}}
    NamedResourceRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        description: {type: string}
    ReplaceIDsRequest:
      type: object
      properties:
        ids: {type: array, items: {type: string, format: uuid}}
        roleIds: {type: array, items: {type: string, format: uuid}}
        tagIds: {type: array, items: {type: string, format: uuid}}
    SetProjectGroupRequest:
      type: object
      properties:
        groupId: {type: string, format: uuid, nullable: true}
    RuntimeUserCreateRequest:
      type: object
      required: [username, initialPassword]
      properties:
        username: {type: string}
        initialPassword: {type: string, format: password, minLength: 8}
        roleIds: {type: array, items: {type: string, format: uuid}}
    RuntimeUserStatusRequest:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [active, disabled]}
    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: {type: string, format: password, minLength: 8}
    RuntimeRoleCreateRequest:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
        description: {type: string}
        capabilities: {type: array, items: {type: string}}
    RuntimeRoleUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/RuntimeRoleCreateRequest'
    NodeApprovalRequest:
      type: object
      properties:
        reason: {type: string}
    PublishVersionRequest:
      type: object
      required: [version]
      properties:
        version: {type: string}
        name: {type: string}
        description: {type: string}
    DeployRequest:
      type: object
      required: [nodeIds]
      properties:
        nodeIds: {type: array, items: {type: string, format: uuid}}
        runtimeConfig: {type: object, additionalProperties: true}
    RollbackRequest:
      type: object
      required: [nodeId]
      properties:
        nodeId: {type: string, format: uuid}
    ApiResponse:
      type: object
      required: [code, msg, data, reqId]
      properties:
        code:
          type: integer
        msg:
          type: string
        data:
          nullable: true
        reqId:
          type: string
security:
  - bearerAuth: []
