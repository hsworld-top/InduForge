      tags: [sceneContract]
      x-client: designer
      summary: 保存场景公开契约并同步工程上下文
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
        - name: kind
          in: path
          required: true
          schema: {type: string, enum: ['2d', '3d']}
        - name: sceneId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        default:
          description: 失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      operationId: deleteSceneContract
      tags: [sceneContract]
      x-client: designer
      summary: 删除场景公开契约并同步工程上下文
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
        - name: kind
          in: path
          required: true
          schema: {type: string, enum: ['2d', '3d']}
        - name: sceneId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        default:
          description: 失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [username, password, captchaKey, captchaCode]
      properties:
        username: {type: string}
        password: {type: string, format: password}
        tenantCode: {type: string}
        captchaKey: {type: string}
        captchaCode: {type: string}
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: {type: string}
    ChangePasswordRequest:
      type: object
      properties:
        oldPassword: {type: string, format: password}
        newPassword: {type: string, format: password, minLength: 8}
    TenantCreateRequest:
      type: object
      required: [name, code]
      properties:
        name: {type: string}
        code: {type: string}
        description: {type: string}
        status: {type: string}
    TenantUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/TenantCreateRequest'
    NoteRequest:
      type: object
      required: [content]
      properties:
        content: {type: string, maxLength: 2000}
    UserCreateRequest:
      type: object
      required: [username, password, role]
      properties:
        username: {type: string}
        password: {type: string, format: password, minLength: 8}
        role: {type: string}
        status: {type: string}
    UserUpdateRequest:
      type: object
      properties:
        email: {type: string}
        phone: {type: string}
        fullName: {type: string}
        role: {type: string}
        status: {type: string}
    ProjectCreateRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        code: {type: string}
        description: {type: string}
    ProjectUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ProjectCreateRequest'
    ProjectDeleteRequest:
      type: object
      properties:
        confirmation: {type: string}
    ProjectOperationRequest:
      type: object
      properties:
        operation: {type: string}
    DesignFileActionRequest:
      type: object
      required: [command, data]
      properties:
        command:
          type: string
          enum: [explore, upload, source, remove, rename, mkdir, locate, paste, import]
        data:
          nullable: true
    DesignFileExportRequest:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
    ProjectImportRequest:
      type: object
      properties:
        files: {type: object, additionalProperties: {type: string}}
    NamedResourceRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        description: {type: string}
    ReplaceIDsRequest:
      type: object
      properties:
        ids: {type: array, items: {type: string, format: uuid}}
        roleIds: {type: array, items: {type: string, format: uuid}}
        tagIds: {type: array, items: {type: string, format: uuid}}
    SetProjectGroupRequest:
      type: object
      properties:
        groupId: {type: string, format: uuid, nullable: true}
    RuntimeUserCreateRequest:
      type: object
      required: [username, initialPassword]
      properties:
        username: {type: string}
        initialPassword: {type: string, format: password, minLength: 8}
        roleIds: {type: array, items: {type: string, format: uuid}}
    RuntimeUserStatusRequest:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [active, disabled]}
    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: {type: string, format: password, minLength: 8}
    RuntimeRoleCreateRequest:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
        description: {type: string}
        capabilities: {type: array, items: {type: string}}
    RuntimeRoleUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/RuntimeRoleCreateRequest'
    NodeApprovalRequest:
      type: object
      properties:
        reason: {type: string}
    PublishVersionRequest:
      type: object
      required: [version]
      properties:
        version: {type: string}
        name: {type: string}
        description: {type: string}
    DeployRequest:
      type: object
      required: [nodeIds]
      properties:
        nodeIds: {type: array, items: {type: string, format: uuid}}
        runtimeConfig: {type: object, additionalProperties: true}
    RollbackRequest:
      type: object
      required: [nodeId]
      properties:
        nodeId: {type: string, format: uuid}
    ApiResponse:
      type: object
      required: [code, msg, data, reqId]
      properties:
        code:
          type: integer
        msg:
          type: string
        data:
          nullable: true
        reqId:
          type: string
security:
  - bearerAuth: []
