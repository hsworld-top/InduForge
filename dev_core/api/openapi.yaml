  /auth/me/avatar:
    delete:
      operationId: deleteCurrentUserAvatar
      tags: [auth]
      summary: 恢复当前账号的默认头像
      responses:
        '200':
          description: 当前用户资料，avatarUrl 为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        default:
          description: 失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      operationId: uploadCurrentUserAvatar
      tags: [auth]
      summary: 上传当前账号头像
      description: 仅允许本人；PNG、JPEG 或 WebP，不超过 5MB、1600 万像素；服务端居中裁剪为 256×256 PNG，使用既有 users.avatar 保存对象键。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 当前用户资料，含 avatarUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        default:
          description: 失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      operationId: getCurrentUserAvatar
      tags: [auth]
      summary: 读取当前账号头像
      description: 通过同源会话读取本人头像，不公开对象存储地址；成功为图片流，失败使用统一 JSON 包络。
      responses:
        '200':
          description: 当前用户头像
          content:
            image/png:
              schema:
                type: string
                format: binary
        default:
          description: 失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /auth/me:
    put:
      operationId: updateCurrentAuthUser
      tags: [auth]
      summary: 更新当前用户个人资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fullName, email]
              properties:
                fullName:
                  type: string
                  nullable: true
                  maxLength: 100
                email:
                  type: string
                  nullable: true
                  maxLength: 254
                  description: 联系邮箱，非空时必须为纯邮箱地址；空串或 null 清除
      responses:
        '200':
          description: 当前用户信息，与 GET /auth/me 一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        default:
          description: 失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: getCurrentAuthUser
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        default:
          description: 失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /auth/password:
