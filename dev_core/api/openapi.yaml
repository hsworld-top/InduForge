      summary: 挂载、更新或移除当前场景资源绑定
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SceneAssetActionRequest'}}}}
      responses:
        '200': {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/ApiResponse'}}}}
  /scene-editor-sessions/{sessionId}/assets/{assetId}/replace:
    post:
      operationId: replaceSceneEditorAsset
