        - {$ref: '#/components/parameters/SessionId'}
        - {name: directory, in: query, schema: {type: string}}
        - {name: keyword, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/ApiResponse'}}}}
  /scene-asset-editor-sessions/{sessionId}/files/content:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
      - {name: path, in: query, required: true, schema: {type: string}}
    get:
      operationId: getSceneAssetEditorFileContent
      tags: [scene]
      x-client: ht-editor
      summary: 受控读取资源工作副本文件
      responses:
        '200': {description: 文件流, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
    put:
      operationId: putSceneAssetEditorFileContent
      tags: [scene]
      x-client: ht-editor
      summary: 以乐观锁保存资源工作副本 JSON
      parameters:
        - {name: baseDraftVersion, in: query, required: true, schema: {type: integer, format: int64}}
      requestBody: {required: true, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
      responses:
        '200': {description: 成功, content: {application/json: {schema: {$ref: '#/components/schemas/ApiResponse'}}}}
