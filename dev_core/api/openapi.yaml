  /projects:
    get:
      operationId: listProjects
      tags: [project]
      summary: listProjects
      description: 稳定按updated_at DESC、id DESC分页。每个data.list项目附deploymentSummary，由当前页项目ID一次租户隔离批量查询；包含deploymentCount、environmentCount、operationInProgress、updatedAt、primarySelection及primaryDeployment。仅deploymentCount=1时primarySelection=unique并返回primaryDeployment；0为none，多部署为multiple且primaryDeployment=null，不以最近/默认环境部署代表全部。primary的mode为development|production，observedStatus沿正式部署状态，不新增deploying枚举。pending run、删除请求，或非失败/非异常部署中未失败运行引擎的desiredGeneration大于observedGeneration时，operationInProgress为true；updating保留代次细分。失败/异常部署、失败服务及反向代次不持续阻塞异常处理。placements/services是现有槽位预填，不替代当前制品的required引擎判断。摘要查询失败则整个列表失败，不返回伪造0。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        default:
          description: 失败
          content:
            application/json:
              schema:
