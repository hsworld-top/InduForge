# NodeAgent 配置文件
# 说明：
# - 标记 [前端管理] 的配置项由前端初始化向导自动设置
# - 标记 [后端使用] 的配置项由后端服务使用
# - 标记 [可选] 的配置项有默认值，可不配置

agent:
  # [前端管理] 节点运行模式: online | offline
  mode: "offline"

  # [前端管理] 在线模式配置（初始化后由前端填充）
  online:
    centerUrl: ""     # 运维中心地址，前端输入
    nodeId: ""        # 节点ID，运维中心分配
    registrationToken: ""  # 注册Token，运维中心分配

  # [后端使用] 服务监听配置
  listen:
    host: "0.0.0.0"
    port: 8081

  # [后端使用] 执行器配置
  executor:
    type: "process"   # process | docker | systemd
    process:
      workDir: "./runtime"   # 项目运行时目录
      logDir: "./logs"       # 日志目录
      binary: "runtime_engine"  # 可执行文件名称
    docker:
      enabled: false
      socket: "/var/run/docker.sock"
      network: "node_agent"
      imagePrefix: "node_agent_runtime"
    systemd:
      enabled: false
      unitTemplate: "/etc/systemd/system/node_agent_{project}.service"

  # [后端使用] 运行时配置
  runtime:
    workDir: "./runtime"
    healthCheck:
      enabled: true
      interval: 30s
      timeout: 5s
      endpoint: "/health"
      retries: 3

  # [后端使用] 网络配置（在线模式心跳上报）
  network:
    heartbeat:
      enabled: true
      interval: 10s
      endpoint: "http://manager:9099/api/v1/nodes/heartbeat"

# [后端使用] 日志配置
logging:
  level: "info"
  format: "json"
  output: "stdout"
  file: "./logs/agent.log"

# [后端使用] 存储配置
storage:
  type: "local"
  local:
    dataDir: "./data"
