agent:
  listen: { host: 127.0.0.1, port: 17601 }
  executor:
    { type: process, process: { workDir: ./runtime, logDir: ./logs, binary: runtime_engine } }
  ops:
    enabled: true
    # 节点安全模式独立于工程开发版/发布版；生产部署显式改为 production。
    securityMode: development
    serverUrl: ''
    enrollmentCode: ''
    agentVersion: '__BUILD_VERSION__'
    heartbeatEvery: 10s
    dataDir: ./data
    # Hostd 是唯一 root 特权边界；NodeAgent 只通过本机 Unix socket 提交固定 K3s 计划。
    hostdSocket: /run/induforge/hostd.sock
    hostDataDir: '__HOST_DATA_DIR__'
    nodeIp: '__NODE_IP__'
    # Release 公钥只来自节点本地配置；中心 Binding 只能引用 keyId。
    trustKeys: []
    # 能力二进制与 Agent 来自同一离线包，兼容性版本固定为包 BUILD_VERSION。
    runtimeVersion: '__BUILD_VERSION__'
    # installed 表示本机已安装的能力，可用于领取节点身份；enabled 只有在
    # releaseRoot/releaseDigest/executable/healthUrl 全部由本机运维配置后才可设为 true。
    # 中心不能下发命令、路径、环境变量或 release 物料。
    services:
      - group: project_entry
        component: project-gateway
        installed: true
        enabled: false
        publicUrl: ''
      - group: project_entry
        component: runtime-api
        installed: true
        enabled: false
      - group: data_runtime
        component: runtime-engine
        installed: true
        enabled: false
      - group: collector
        component: collector
        # Linux 正常节点包内置采集引擎能力；是否创建采集工作负载仍由工程部署决定。
        installed: true
        enabled: false
logging: { file: ./logs/agent.log, level: info }
