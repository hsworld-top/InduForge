agent:
  listen: { host: 127.0.0.1, port: 17601 }
  executor:
    { type: process, process: { workDir: ./runtime, logDir: ./logs, binary: runtime_engine } }
  ops:
    enabled: true
    serverUrl: ''
    enrollmentCode: ''
    role: runtime_linux
    heartbeatEvery: 10s
    dataDir: ./data
    demoRuntime: true
  # runtime_linux 预留 K3s 接入入口；demo 不安装/拉起 K3s。
  k3s: { enabled: false, mode: agent, serverUrl: '', tokenFile: '' }
logging: { file: ./logs/agent.log, level: info }
