name: induforge

services:
  edge:
    container_name: induforge-edge
    image: induforge/edge:latest
    build:
      context: ../..
      dockerfile: scripts/docker/edge/Dockerfile
    ports:
      - '${IF_EDGE_HOST_PORT:-18080}:80'
    environment:
      DEV_CORE_INTERNAL_PORT: ${DEV_CORE_INTERNAL_PORT:-18101}
      DATA_SERVICE_INTERNAL_PORT: ${DATA_SERVICE_INTERNAL_PORT:-18102}
      NGINX_ENVSUBST_FILTER: '^(DEV_CORE_INTERNAL_PORT|DATA_SERVICE_INTERNAL_PORT)$'
    depends_on:
      - control
      - data
    networks:
      - induforge-prod-net
    restart: unless-stopped

  control:
    container_name: induforge-control
    image: induforge/control:latest
    build:
      context: ../..
      dockerfile: dev_core/Dockerfile
    env_file:
      - ../../.env
    environment:
      DEV_CORE_ADDR: :${DEV_CORE_INTERNAL_PORT:-18101}
      DB_AUTO_SCHEMA_SYNC: 'false'
      IF_META_STORE_HOST: meta-store
      IF_META_STORE_PORT: ${IF_META_STORE_PORT:-18432}
      IF_CACHE_STORE_HOST: cache-store
      IF_CACHE_STORE_PORT: ${IF_CACHE_STORE_PORT:-18379}
      IF_OBJECT_STORE_ENDPOINT: object-store
      IF_OBJECT_STORE_PORT: ${IF_OBJECT_STORE_PORT:-18500}
      CODE_WORKSPACE_ROOT: /var/lib/induforge/workspaces
      CODE_WORKSPACE_VOLUME: ${CODE_WORKSPACE_VOLUME:-induforge-control-workspaces}
      CODE_SERVER_DOCKER_HOST: unix:///var/run/docker.sock
      CODE_SERVER_IMAGE: ${CODE_SERVER_IMAGE:-induforge/designer-code-server:4.131.0-node24.19.0-pnpm11.21.0-a8eafe26-arm64}
      CODE_SERVER_BIND_HOST: ${CODE_SERVER_BIND_HOST:-127.0.0.1}
    volumes:
      - induforge-control-workspaces:/var/lib/induforge/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - '${DEV_CORE_INTERNAL_PORT:-18101}'
    depends_on:
      - meta-store
      - cache-store
      - object-store
    networks:
      - induforge-prod-net
    restart: unless-stopped

  data:
    container_name: induforge-data
    image: induforge/data:latest
    build:
      context: ../..
      dockerfile: data_service/Dockerfile
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      DB_AUTO_SCHEMA_SYNC: 'false'
      DATA_SERVICE_ADDR: :${DATA_SERVICE_INTERNAL_PORT:-18102}
      DATA_SERVICE_COMPUTE_SANDBOX_URL: http://compute-sandbox:${COMPUTE_SANDBOX_INTERNAL_PORT:-18103}
      DATA_SERVICE_COMPUTE_SANDBOX_TOKEN: ${DATA_SERVICE_COMPUTE_SANDBOX_TOKEN}
      IF_META_STORE_HOST: meta-store
      IF_META_STORE_PORT: ${IF_META_STORE_PORT:-18432}
      IF_CACHE_STORE_HOST: cache-store
      IF_CACHE_STORE_PORT: ${IF_CACHE_STORE_PORT:-18379}
    expose:
      - '${DATA_SERVICE_INTERNAL_PORT:-18102}'
    depends_on:
      - meta-store
      - cache-store
      - message-hub
      - compute-sandbox
    networks:
      - induforge-prod-net
      - induforge-compute-net
    restart: unless-stopped

  compute-sandbox:
    container_name: induforge-compute-sandbox
    image: induforge/compute-sandbox:latest
    build:
      context: ../../compute_sandbox
      dockerfile: Dockerfile
    environment:
      COMPUTE_SANDBOX_ADDR: :${COMPUTE_SANDBOX_INTERNAL_PORT:-18103}
      COMPUTE_SANDBOX_TOKEN: ${DATA_SERVICE_COMPUTE_SANDBOX_TOKEN}
    expose:
      - '${COMPUTE_SANDBOX_INTERNAL_PORT:-18103}'
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - compute-dependencies:/dependencies
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
      # bubblewrap 需要 mount/pivot_root 创建每次执行的只读根文件系统；用户脚本仍在其新命名空间内运行。
      - seccomp:unconfined
    pids_limit: 64
    mem_limit: 384m
    cpus: 1.0
    networks:
      - induforge-prod-net
      - induforge-compute-net
    restart: unless-stopped

  meta-store:
    container_name: induforge-meta-store
    image: timescale/timescaledb:2.26.4-pg16
    command: ['-p', '${IF_META_STORE_PORT:-18432}', '-c', 'shared_preload_libraries=timescaledb']
    environment:
      POSTGRES_USER: ${IF_META_STORE_USER:-postgres}
      POSTGRES_PASSWORD: ${IF_META_STORE_PASSWORD:-postgres}
      POSTGRES_DB: ${IF_META_STORE_ADMIN_DATABASE:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - induforge-meta-store-data:/var/lib/postgresql/data
    networks:
      - induforge-prod-net
    restart: unless-stopped

  cache-store:
    container_name: induforge-cache-store
    image: redis:7.2-alpine
    command:
      - sh
      - -c
      - |
        if [ -n "$${IF_CACHE_STORE_PASSWORD}" ]; then
          exec redis-server --port ${IF_CACHE_STORE_PORT:-18379} --appendonly yes --requirepass "$${IF_CACHE_STORE_PASSWORD}"
        fi
        exec redis-server --port ${IF_CACHE_STORE_PORT:-18379} --appendonly yes
    environment:
      IF_CACHE_STORE_PASSWORD: ${IF_CACHE_STORE_PASSWORD:-}
    volumes:
      - induforge-cache-store-data:/data
    networks:
      - induforge-prod-net
    restart: unless-stopped

  message-hub:
    container_name: induforge-message-hub
    image: emqx/emqx:5.6.1
    environment:
      EMQX_NAME: induforge
      EMQX_HOST: message-hub
      EMQX_LISTENERS__TCP__DEFAULT__BIND: '0.0.0.0:${IF_MESSAGE_HUB_MQTT_PORT:-18883}'
      EMQX_LISTENERS__WS__DEFAULT__BIND: '0.0.0.0:${IF_MESSAGE_HUB_WS_PORT:-18083}'
      EMQX_DASHBOARD__LISTENERS__HTTP__BIND: '0.0.0.0:${IF_MESSAGE_HUB_DASHBOARD_PORT:-18084}'
    volumes:
      - induforge-message-hub-data:/opt/emqx/data
      - induforge-message-hub-log:/opt/emqx/log
    networks:
      - induforge-prod-net
    restart: unless-stopped

  object-store:
    container_name: induforge-object-store
    image: chrislusf/seaweedfs:3.85
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        cat > /tmp/induforge-s3.json <<EOF
        {"identities":[{"name":"induforge-admin","credentials":[{"accessKey":"$${IF_OBJECT_STORE_ACCESS_KEY}","secretKey":"$${IF_OBJECT_STORE_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -ip=object-store -ip.bind=0.0.0.0 -master.port=${IF_OBJECT_STORE_MASTER_PORT:-18333} -master.volumeSizeLimitMB=1024 -volume.port=${IF_OBJECT_STORE_VOLUME_PORT:-18081} -volume.max=0 -dir=/data/volume -filer -filer.port=${IF_OBJECT_STORE_FILER_PORT:-18888} -s3 -s3.port=${IF_OBJECT_STORE_PORT:-18500} -s3.config=/tmp/induforge-s3.json
    environment:
      IF_OBJECT_STORE_ACCESS_KEY: ${IF_OBJECT_STORE_ACCESS_KEY:-induforge}
      IF_OBJECT_STORE_SECRET_KEY: ${IF_OBJECT_STORE_SECRET_KEY:-induforge_dev_secret}
    volumes:
      - induforge-object-store-master-data:/data
      - induforge-object-store-volume-data:/data/volume
      - induforge-object-store-filer-data:/data/filer
    networks:
      - induforge-prod-net
    restart: unless-stopped

networks:
  induforge-prod-net:
    name: induforge-prod-net
  induforge-compute-net:
    name: induforge-compute-net
    internal: true

volumes:
  compute-dependencies:
    name: induforge-compute-dependencies
  induforge-control-workspaces:
    name: ${CODE_WORKSPACE_VOLUME:-induforge-control-workspaces}
  induforge-meta-store-data:
    name: induforge-meta-store-data
  induforge-cache-store-data:
    name: induforge-cache-store-data
  induforge-message-hub-data:
    name: induforge-message-hub-data
  induforge-message-hub-log:
    name: induforge-message-hub-log
  induforge-object-store-master-data:
    name: induforge-object-store-master-data
  induforge-object-store-volume-data:
    name: induforge-object-store-volume-data
  induforge-object-store-filer-data:
    name: induforge-object-store-filer-data
