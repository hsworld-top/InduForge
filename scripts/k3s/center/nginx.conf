events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  client_max_body_size 64m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # 工作区必须使用独立 Host 根路径。这里只识别受控服务名和 UUID 形状，
  # 精确域名、工程、租户、权限与 epoch 仍由 center-control 网关校验。
  server {
    listen 80;
    server_name "~^(?:ai|code|preview|preview-control)-[0-9a-f-]{36}\..+$";
    return 308 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name "~^(?:ai|code|preview|preview-control)-[0-9a-f-]{36}\..+$";
    ssl_certificate /etc/nginx/tls/center.crt;
    ssl_certificate_key /etc/nginx/tls/center.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://center-control:18101;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }
  }

  server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 数据中心前端的正式 API 由数据服务处理，不能落入控制面通配代理。
    location /api/v1/data {
      proxy_pass http://center-data:18102;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
      proxy_pass http://center-control:18101;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
      proxy_pass http://center-control:18101/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /control-socket.io {
      proxy_pass http://center-control:18101;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }

    # 微前端带 hash 的资产缺失时不能退回 index.html。Wujie 会将回退 HTML 当作
    # CSS/JS 注入 shadow DOM，导致设计器白屏；明确 404 后可由入口重新加载新 hash。
    location = /designer/ {
      try_files /designer/index.html =404;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /designer/index.html {
      try_files $uri =404;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /datacenter/ {
      try_files /datacenter/index.html =404;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /datacenter/index.html {
      try_files $uri =404;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ~* ^/(?:designer|datacenter)/assets/[0-9A-Za-z_.-]+\.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?|ttf)$ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /designer/ {
      try_files $uri $uri/ /designer/index.html;
    }

    location /datacenter/ {
      try_files $uri $uri/ /datacenter/index.html;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }

  server {
    listen 443 ssl default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    ssl_certificate /etc/nginx/tls/center.crt;
    ssl_certificate_key /etc/nginx/tls/center.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HTTPS 与 HTTP 使用同一数据域入口，避免计算/报警页面被控制面返回 404。
    location /api/v1/data {
      proxy_pass http://center-data:18102;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
      proxy_pass http://center-control:18101;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
      proxy_pass http://center-control:18101/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /control-socket.io {
      proxy_pass http://center-control:18101;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }

    location = /designer/ {
      try_files /designer/index.html =404;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /designer/index.html {
      try_files $uri =404;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /datacenter/ {
      try_files /datacenter/index.html =404;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /datacenter/index.html {
      try_files $uri =404;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ~* ^/(?:designer|datacenter)/assets/[0-9A-Za-z_.-]+\.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?|ttf)$ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /designer/ {
      try_files $uri $uri/ /designer/index.html;
    }

    location /datacenter/ {
      try_files $uri $uri/ /datacenter/index.html;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
