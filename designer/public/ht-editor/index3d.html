<!DOCTYPE html>
<html>

<head>
    <title>InduForge 3D 编辑器</title>
    <meta charset="UTF-8">
    <meta name='viewport' content='user-scalable=no'>
    <link rel="icon" href="custom/images/induforge.svg">
    <style>
        html,
        body {
            padding: 0px;
            margin: 0px;
        }
        .dialog-container{
            left: 25% !important;
            top: 25% !important;
        }
    </style>

    <script src='config/engine.js'></script>
    <script src='custom/configs/config-transform.js'></script>
    <script src='custom/configs/config-service.js'></script>

    <!-- configuration for editor -->
    <script src='custom/configs/3d/config.js'></script>

    <script src='runtime/core.js'></script>

    <script src='custom/configs/buckle.js'></script>
    <script src="runtime/extensions/css-animation.js"></script>
    <script src='runtime/extensions/context-menu.js'></script>
    <script src='runtime/extensions/dialog.js'></script>
    <script src='runtime/extensions/edge-type.js'></script>
    <script src='runtime/extensions/form.js'></script>
    <script src='runtime/extensions/overview.js'></script>
    <script src="runtime/extensions/auto-layout.js"></script>
    <script src="runtime/extensions/object-model.js"></script>
    <script src="runtime/extensions/modeling.js"></script>
    <script src="runtime/extensions/history.js"></script>
    <script src="runtime/extensions/vector.js"></script>


    <script>
        function init() {
            var urls = InduSceneStudioConfig.subConfigs || [];
            urls.push('runtime/studio-2d.js');
            InduSceneEngine.Default.loadJS(urls, function () {
                InduSceneEngine.Default.loadJS(['runtime/studio-3d.js'], function () {
                    InduSceneStudioConfig.indent = 90;
                    urls = [
                        'locales/' + InduSceneStudioConfig.locale + '.js',
                        'custom/locales/' + InduSceneStudioConfig.locale + '.js'
                    ];
                    if (InduSceneStudioConfig.libs) {
                        urls = urls.concat(InduSceneStudioConfig.libs);
                    }
                    InduSceneEngine.Default.loadJS(urls, function () {
                        InduSceneStudio.init();
                        var entryPath = new URLSearchParams(window.location.search).get('open');
                        window.editor3d = InduSceneStudio3D.createEditor3d({ open: entryPath || undefined });
                        window.editor3d.preview = function () {
                            var previewURL = this.dm.a("previewURL") || "scene.html";
                            var params = new URLSearchParams({ sessionId: new URLSearchParams(window.location.search).get('sessionId') || '', open: entryPath || '', mode: 'draft' });
                            previewURL += (previewURL.indexOf('?') < 0 ? '?' : '&') + params.toString();
                            var data = {
                                url: previewURL
                            };
                            this.fireEvent("sceneViewPreviewing", data);
                            window.open(data.url, data.url);
                        }
                        // 实现iframe和父页面的通讯
                        window.addEventListener('message', function (e) {
                            if (e.source !== window.parent || e.origin !== window.location.origin) return;
                            if (e.data && e.data.source === 'induforge-host' && e.data.type === 'save') {
                                // 父页面触发保存,如果没有数据则不进行保存
                                if (window.editor3d.dm.size()) {
                                    window.editor3d.save();
                                    window.parent.postMessage({ source: 'induforge-scene', type: 'closed' }, window.location.origin);
                                } else {
                                    window.parent.postMessage({ source: 'induforge-scene', type: 'closed' }, window.location.origin);
                                }
                            }
                        }, false);
                    });
                });
            });
        }
    </script>
</head>

<body onload='init()'>
</body>

</html>
