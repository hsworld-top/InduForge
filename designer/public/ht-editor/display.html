<!DOCTYPE html>
<html>
  <head>
    <title>InduForge 2D 预览</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="custom/images/induforge.svg">
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; }
      .viewer-badge { position: fixed; top: 12px; right: 12px; z-index: 2; padding: 6px 9px; color: #fff; background: rgba(24, 32, 29, .78); border-radius: 4px; font: 12px Arial, sans-serif; }
    </style>
    <script src="config/engine.js"></script>
    <script src="custom/configs/config-transform.js"></script>
    <script src="custom/configs/config-service.js"></script>
    <script src="runtime/core.js"></script>
    <script src="runtime/ui.js"></script>
    <script src="runtime/extensions/edge-type.js"></script>
    <script src="runtime/extensions/object-model.js"></script>
    <script src="runtime/extensions/vector.js"></script>
    <script src="runtime/extensions/animation.js"></script>
    <script src="runtime/extensions/live-controls.js"></script>
    <script src="runtime/extensions/dash-flow.js"></script>
    <script src="runtime/extensions/path-flow.js"></script>
    <script src="custom/libs/InduForgeService.js"></script>
    <script src="custom/libs/InduForgeAnimation.js"></script>
    <script src="custom/libs/InduForgeSceneRuntime.js"></script>
    <script src="custom/configs/2d/config-pipeProperties.js"></script>
    <script>
      async function init() {
        var params = new URLSearchParams(window.location.search);
        var entryPath = params.get('open');
        var viewer = await window.InduForgeViewerSession.bootstrap();
        if (viewer) {
          entryPath = viewer.entryPath;
          window.InduForgeScene.configure({ sceneId: viewer.sceneId });
          window.setInterval(function () { window.InduForgeViewerSession.heartbeat().catch(window.InduForgeScene.reportError); }, 10 * 60 * 1000);
        }
        if (!entryPath) throw new Error('缺少场景入口');
        var dataModel = new InduSceneEngine.DataModel();
        var graphView = new InduSceneEngine.graph.GraphView(dataModel);
        if (graphView.enableDashFlow) graphView.enableDashFlow(50);
        if (graphView.enableFlow) graphView.enableFlow(50);
        graphView.addToDOM();
        graphView.deserialize(entryPath, function () {
          dataModel.each(function (data) { if (window.InduForgePipe) window.InduForgePipe.apply(data); });
          if (window.InduForgeAnimation) window.InduForgeAnimation.applyModel(dataModel);
          if (window.InduForgeSceneRuntime) window.InduForgeSceneRuntime.bindGraphView(graphView);
          graphView.fitContent(false, 20);
          if (viewer) window.InduForgeScene.markReady();
        });
        if (params.get('mode') === 'draft') {
          var badge = document.createElement('div');
          badge.className = 'viewer-badge';
          badge.textContent = 'InduForge · 草稿预览';
          document.body.appendChild(badge);
        }
      }
    </script>
  </head>
  <body onload="init().catch(window.InduForgeScene.reportError)"></body>
</html>
