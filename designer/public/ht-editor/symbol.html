<!DOCTYPE html>
<html>
    <head>
        <title>InduForge 资源预览</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
        <link rel="icon" href="custom/images/induforge.svg" />
        <style>
            html, body {
                padding: 0px;
                margin: 0px;
            }
        </style>

        <script src='config/engine.js'></script>
        <script src='runtime/core.js'></script>

        <script>
            function init() {
                dataModel = new InduSceneEngine.DataModel();
                graphView = new InduSceneEngine.graph.GraphView(dataModel);
                graphView.addToDOM();
                graphView.setEditable(true);

                InduSceneEngine.Default.xhrLoad('previews/symbol.json', function(text) {
                    var json = InduSceneEngine.Default.parse(text);
                    if (json.title) document.title = json.title;
                    dataModel.setBackground(json.background);
                    node = new InduSceneEngine.Node();
                    node.setImage(json);
                    node.setPosition(graphView.getWidth()/2, graphView.getHeight()/2);
                    dataModel.add(node);
                });
            }

        </script>
        <script src='custom/libs/InduForgeService.js'></script>
</head>
    <body onload='setTimeout(init, 300)'>
    </body>
</html>
